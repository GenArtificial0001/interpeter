[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interpreter"
version = "0.1.0"
description = "Intérprete de voz local en tiempo real (español -> inglés/portugués/francés) con voz clonada"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.10",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Modelos locales (torch CPU desde el índice de Ford).
ml = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=0.30",
    "sentencepiece>=0.2",
    "sacremoses>=0.1",
    "onnxruntime>=1.17",
    "huggingface-hub>=0.25",
    "librosa>=0.10",
]
clone = ["coqui-tts>=0.24"]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pyinstaller>=6"]

[project.scripts]
interpreter-bench = "interpreter.bench:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "models: requiere modelos descargados (lento); se omite por defecto",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
